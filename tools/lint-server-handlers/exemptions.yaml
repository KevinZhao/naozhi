# lint-server-handlers exemptions
#
# 数据来源：2026-07-31 fail 模式切换时按 master 实测重采（前一版基于
# origin/master HEAD 5a7f04aa 2026-05-28）
# 配套：docs/design/server-split-phase4-design.md v0.6.1 §6.2.0.4 + §0 事实速查表
#
# 规则：
# - server 包文件硬上限 limit:500（不是 800）— 见 §9.2 file_size budget
# - dashboard 子包文件硬上限 800（v0.6.1 暂无此条目）
# - 每条 until_phase 标到具体 phase；该 phase merge 时 PR commit 必须含
#   "Closes-exemption: <file>" trailer，否则 rule 5 (stale_exemption) fail
# - 豁免清单原则上不新增条目；但 baseline `current` 必须随 master 漂移
#   更新（preflight 必检 — 见 §6.2.0.4）
#
# 2026-07-31 fail 模式切换说明：
# - 原计划"Phase 5 完工后切 fail"，但 ADR-001 判定 4b 暂缓 → Phase 5 的
#   触发条件不再会到来，warn 模式事实上被永久化。本次以当日实测行数为
#   baseline 直接切 fail：baseline 冻结当前水位，再长一行即卡 PR。
# - "不新增条目"规则的前提是 phase 会持续落地；4b 暂缓后，R243-ARCH-2
#   从 wshub.go 拆出的 wshub_broadcast.go / wshub_subscribe.go 无豁免
#   会让 fail 模式永久红。为两文件补录条目（见下），与 wshub.go 同挂
#   until_phase 4b。

file_size:
    # 8 个 > 800 行 + 3 个 500-800 行 = 11 个超限（2026-07-31 重采）
    # ── 8 个 > 800 行 ──
    # internal/server/dashboard_session.go: removed Phase 3e (PR #1441) — file
    # moved to internal/dashboard/session/handlers.go. Closes-exemption trailer
    # in commit message satisfies rule 5.
    - path: internal/dashboard/session/handlers.go
      current: 2055                         # 2026-07-31 fail 切换重采（Phase 3e 搬迁时 1873）
      limit: 800
      until_phase: "5"        # Phase 5 内部拆分（按 6 handler + history cache + retired store 分文件）
    # internal/server/project_files.go: removed Phase 2 (PR #1437) — file
    # moved to internal/dashboard/project/files.go. Closes-exemption trailer
    # in commit message satisfies rule 5. New dashboard/project/files.go
    # entry tracks the post-move size (1633) until Phase 5 internal split.
    - path: internal/dashboard/project/files.go
      current: 1769                         # 2026-09-02 +1：textMimeSet 加 application/typescript（PR #2439 .ts/.tsx 预览误判二进制）；2026-07-31 fail 切换重采（Phase 2 搬迁时 1633）；dashboard 子包硬上限 800
      limit: 800
      until_phase: "5"        # Phase 5 内部拆分（每个 serve* / handle* 一个文件）
    - path: internal/server/dashboard_send.go
      current: 1089                         # 2026-07-31 fail 切换重采（2026-05-28 send_persist.go 抽离后 997）
      limit: 500
      until_phase: 3f
    # internal/server/dashboard_cron.go: removed Phase 1 (PR #1438) — file
    # moved to internal/dashboard/cron/handlers.go. Closes-exemption trailer
    # in commit message satisfies rule 5.
    # internal/server/dashboard_cron_transcript.go: removed Phase 1 — file
    # moved to internal/dashboard/cron/transcript.go.
    - path: internal/dashboard/cron/handlers.go
      current: 1814                         # 2026-07-31 fail 切换重采（Phase 1 搬迁时 1628）
      limit: 800
      until_phase: "5"        # Phase 5 内部拆分（按 11 handler 分文件）
    - path: internal/dashboard/cron/transcript.go
      current: 1438                         # Phase 1 搬迁后实际行数
      limit: 800
      until_phase: "5"        # Phase 5 内部拆分
    - path: internal/server/server.go
      current: 699                          # 2026-09-04 重采（#2498：self-update 字段组迁 dashboard/ext/system）
      limit: 500
      until_phase: "5"
    - path: internal/server/wshub.go        # v0.6.1 新增豁免：v0.4 时 514 不超线
      current: 1381                         # 2026-07-31 fail 切换重采（2026-05-28 时 1107）
      limit: 500
      until_phase: 4b
    - path: internal/server/routes.go         # v0.6.1 新增豁免：v0.4 时 731 不超线
      current: 516                          # 2026-09-04 重采（#2498：/api/system + /api/planner 注册 dashboard/ext handler）
      limit: 500
      until_phase: "5"
    # internal/server/agent_tailer.go: entry removed 2026-07-31 — tailerRegistry
    # 抽离 (Phase 4c-prep) 后降到 356 行，≤ 500 上限；按 rule 5(b) 语义
    # （文件存在但行数 ≤ limit → 条目应删除）清理豁免债。
    # Closes-exemption: internal/server/agent_tailer.go
    # ── 3 个 500-800 行 ──
    - path: internal/server/send.go
      current: 599                          # 2026-07-31 fail 切换重采（2026-05-31 R248-ARCH-9 后 567）
      limit: 500
      until_phase: 3f
    # 下两条为 2026-07-31 fail 切换补录：R243-ARCH-2 从 wshub.go 拆出的
    # 方法文件，拆分时即超 500；4b 暂缓后无 phase 可等，无豁免则 fail
    # 模式永久红。与 wshub.go 同挂 until_phase 4b。
    - path: internal/server/wshub_broadcast.go
      current: 653                          # 2026-07-31 实测
      limit: 500
      until_phase: 4b
    - path: internal/server/wshub_subscribe.go
      current: 543                          # 2026-07-31 实测
      limit: 500
      until_phase: 4b
    # internal/server/dashboard_auth.go: removed Phase 3a (PR #1436) — file
    # moved to internal/dashboard/auth/handlers.go. Closes-exemption trailer
    # in commit message satisfies rule 5.

# rule 1 (handle_decl) 的唯一豁免。归属规则见 internal/server/doc.go：
# internal/server 只拥有 HTTP 管道（mux/routes、middleware、WS hub、health、
# 静态壳与资源、平台 webhook 注册、send/upload 管线）；其余 /api/* handler
# 一律放 internal/dashboard/<sub> 子包并经 Deps 结构体注入。
handle_baseline:
    - Server.handleDashboard    # 静态壳 GET /dashboard = server 自有
