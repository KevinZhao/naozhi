# naozhi config.example.yaml — copy to config.yaml before first run.
#
# ============================================================================
# Where configuration comes from
# ============================================================================
#   Built-in defaults        fill every key left out here (internal/config
#                            applyDefaults).
#   This file                `naozhi -config config.yaml`. `${VAR}` placeholders
#                            are expanded from the environment at load time; an
#                            unset or refused one stays literal, and a literal
#                            placeholder left in a credential (dashboard_token,
#                            feishu/slack/discord/weixin tokens, upstream.*,
#                            reverse_nodes tokens) fails the load.
#   ~/.claude/settings.json  its `env` block (minus keys the env policy refuses)
#                            is copied into naozhi's process env unless the shell
#                            already set the key; the shim forwards the Anthropic
#                            / AWS / Bedrock keys on to each session CLI. Spawned
#                            cc also reads the file itself, unless
#                            naozhi_settings.enabled points it at an isolated copy.
#   .naozhi/project.yaml     one per project under projects.root. Overrides the
#                            planner model/prompt, default backend and access
#                            profile NAME for that project's sessions. Never
#                            carries env values.
#   Process environment      a few knobs, e.g. TZ, HOME and
#                            NAOZHI_ALLOW_PRIVATE_BASE_URL.
#
# Commands:
#   `naozhi config check -config config.yaml`  validate without booting;
#       -effective prints each backend's spawn argv and (masked) env.
#   `naozhi doctor`                            health checks, with or without a
#       running instance.
# ============================================================================

# A version newer than the binary is rejected at load.
schema_version: 2

server:
  addr: ":8180"
  dashboard_token: "${NAOZHI_DASHBOARD_TOKEN}"
  # trusted_proxy: set true only when an ALB, CloudFront or nginx in front of
  # naozhi stamps X-Forwarded-For / X-Forwarded-Proto. With true, a direct
  # non-loopback request (LAN, no proxy) carries no X-Forwarded-For: its login
  # is refused with 400 and the rate-limited endpoints fail closed. The client
  # IP is the last X-Forwarded-For hop, the one that proxy appends.
  trusted_proxy: false

workspace:
  id: "your-node-id"
  name: "Your Node Name"

cli:
  path: "~/.local/bin/claude"
  # Permission flags come from cli.permission_mode below; don't put
  # --dangerously-skip-permissions or --permission-mode here (both are stripped).
  args: []

  # Optional: MCP servers for naozhi-spawned Claude sessions
  # (docs/rfc/cli-mcp-config.md). Only needed when naozhi_settings.enabled is
  # true: that path spawns cc with `--setting-sources ""`, so ~/.claude.json's
  # mcpServers is not read and sessions see no MCP servers. On the default path
  # cc already reads ~/.claude.json; leave this empty.
  #
  # Must be an ABSOLUTE path to a file shaped like
  #   {"mcpServers": {"asana": {"type": "http", "url": "https://..."}}}
  # (inline JSON is not supported). chmod 600 it: whoever can write it can add
  # a stdio server, i.e. run arbitrary commands in every session; naozhi warns
  # if it is group/other-writable. The file is validated at startup and a bad
  # one degrades to "no MCP", but cc re-reads it on every spawn and refuses to
  # start on a bad file, so RESTART NAOZHI AFTER EDITING IT. OAuth for remote
  # servers: authorize once via /mcp in an interactive `claude` session.
  # mcp_config: "~/.naozhi/mcp.json"

  # Optional: how Claude sessions handle tool permissions (kiro/codex ignore it).
  #   "bypass" (default): --dangerously-skip-permissions, tools run unreviewed.
  #   "auto":  --permission-mode auto, a classifier blocks risky tool calls.
  # Before using "auto", declare what the classifier may trust in
  # `autoMode.environment` of the settings file the CLI loads (the
  # naozhi_settings file, else ~/.claude/settings.json); `claude auto-mode
  # config` prints it. After changing the mode, restart naozhi: each surviving
  # session is detected as config-drifted, shut down, and re-spawned under the
  # new mode when its next message arrives.
  # permission_mode: "auto"

  # Optional: multiple backends in one deployment. The dashboard "new session"
  # picker (or `backend` on POST /api/sessions/send) chooses per session;
  # omitted => cli.backend, else the first entry. An entry's omitted
  # model/args/effort inherit cli.*; an omitted path is auto-detected by id
  # (~/.local/bin/<binary>, the usual install dirs, then $PATH) and never falls
  # back to cli.path. The protocol follows the id: stream-json for "claude",
  # ACP for "kiro", app-server for "codex".
  #
  #backend: "claude"
  #backends:
  #  - id: "claude"
  #  - id: "kiro"
  #    path: "~/.local/bin/kiro-cli"
  #    # Forwarded as `kiro-cli acp --model <id>`; list ids with
  #    # `kiro-cli chat --list-models`. Empty => kiro's own default.
  #    model: "claude-sonnet-4.6"
  #    # Thinking-effort tier: low | medium | high | xhigh | max. claude gets
  #    # `--effort <tier>` (pins it over settings.json effortLevel), kiro
  #    # `--effort <tier>`; empty => the CLI's own default. --effort in args is
  #    # stripped (this field owns it). codex does NOT take effort: it logs a
  #    # warning; use `-c model_reasoning_effort=<tier>` in its args.
  #    # A process start flag: after editing, restart naozhi; each surviving
  #    # session is detected as config-drifted and re-spawned on the new tier at
  #    # its next message. Per node: remote nodes need their own setting.
  #    effort: "xhigh"
  #    args: []
  #    # Optional: models the dashboard's per-session model popover offers.
  #    # kiro reports its own list at session start, which wins; claude reports
  #    # none, so declare the aliases you want (free input also works).
  #    models: ["sonnet", "opus", "haiku"]
  #  - id: "codex"
  #    path: "codex"
  #    # Set model and args explicitly: omitted, they inherit cli.model /
  #    # cli.args, i.e. claude's model name and flags. The model name follows
  #    # model_provider in ~/.codex/config.toml (this one is amazon-bedrock).
  #    model: "openai.gpt-5.5"
  #    args: ["-c", "model_reasoning_effort=high"]
  #
  # A top-level cli.effort is an inheritable default, like cli.model:
  #effort: "high"

session:
  max_procs: 20
  ttl: "30m"
  prune_ttl: "72h"
  cwd: "/path/to/your/workspace"
  watchdog:
    # With the Claude backend a running tool emits a heartbeat every 30s, so
    # no_output_timeout only catches a silent model or a hung CLI. Other
    # backends have no heartbeat: a silent tool must finish within it.
    # Workflows whose turns run for hours can raise both.
    no_output_timeout: "15m"
    total_timeout: "2h"
  store_path: "~/.naozhi/sessions.json"
  # What one session of an IM group chat covers:
  #   thread (default) — each Slack thread / Feishu topic gets its own session;
  #                      a message outside any thread uses the channel's
  #   chat             — the whole channel or group shares one session
  #   user             — each member of the group gets their own session
  # The channel still owns /cd, the project binding and /cron. Discord threads
  # are separate channels and WeChat has only direct chats.
  group_scope: "thread"
  # Answer a Slack / Feishu group @mention posted outside any thread in a new
  # thread (Feishu topic) under it. If Feishu refuses to open the topic, the
  # answer is posted in the group instead.
  thread_auto_open: false
  # project_stable_key is default-on; enabled: false falls back to
  # timestamp keys for dashboard "continue".
  # project_stable_key:
  #   enabled: true
  shim:
    idle_timeout: "8h"
  queue:
    # When a session is busy:
    #   collect     (default) — queue messages, merge into one follow-up prompt
    #   interrupt   — abort the current turn on every new message
    #   passthrough — forward each message to the CLI (stream-json/claude only;
    #                 ACP falls back to collect); enables /urgent <msg>
    mode: "collect"
    max_depth: 20
    collect_delay: "500ms"

agents:
  code-reviewer:
    model: "sonnet"
    system_prompt: "You are a code review expert. Review code for quality, security, and maintainability."
  researcher:
    model: "opus"
    system_prompt: "You are a deep research expert. Decompose questions, search from multiple angles, and synthesize findings."
    # Optional: run this agent under a named access profile (see
    # access_profiles below) and/or a backend listed in cli.backends. A
    # project's own pin outranks them; project planners read neither. A
    # profile-pinned session never runs on a remote node.
    #access_profile: "bedrock"
    #backend: "claude"
    #
    # Optional (claude/kiro): effort tier for this agent.
    # Precedence: cli.effort < cli.backends[].effort < agents[].effort.
    # Caveat: the shim drift check compares backend-level args only, so a
    # per-agent effort (or model) is re-detected as drifted on every restart
    # and re-spawned on its next message. Set it on the backend instead if
    # sessions must survive restarts untouched.
    #effort: "max"

agent_commands:
  review: "code-reviewer"
  research: "researcher"

# Optional: access profiles, named bundles of "how a session reaches the
# model" (docs/rfc/project-access-profile.md). Without any, every session
# runs on the ~/.claude/settings.json baseline.
#
# env is overlaid on that baseline for the profile's sessions. Only the overlay
# allowlist is accepted: CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_SKIP_BEDROCK_AUTH,
# AWS_REGION, AWS_DEFAULT_REGION, ANTHROPIC_MODEL, ANTHROPIC_BASE_URL,
# ANTHROPIC_BEDROCK_BASE_URL and the Anthropic credentials. Any other key,
# AWS_PROFILE and the AWS access keys included, fails the load. A *_FILE value
# is an absolute host path read at spawn (ANTHROPIC_AUTH_TOKEN_FILE →
# ANTHROPIC_AUTH_TOKEN); a missing file fails the spawn.
#
# Which profile a session gets, highest first: the profile it already recorded
# (a resume never switches accounts) > the dashboard pick > the project pin >
# agents[].access_profile > default_access_profile > none. A session that
# recorded no profile is resolved again at its next spawn or resume.
# default_model sits between cli.backends[].model / cli.model and
# agents[].model; default_backend applies only to a new session key and must
# be an enabled backend.
#
#default_access_profile: "bedrock"
#access_profiles:
#  bedrock:
#    display_name: "Bedrock · Opus"
#    chip_color: "#7c5cff"
#    env:
#      CLAUDE_CODE_USE_BEDROCK: "1"
#      AWS_REGION: "us-west-2"
#    default_model: "opus"
#  personal:
#    display_name: "1P · personal"
#    chip_color: "#d97757"
#    env:
#      CLAUDE_CODE_USE_BEDROCK: "0"
#      ANTHROPIC_AUTH_TOKEN_FILE: "/home/ec2-user/.secrets/anthropic-1p.token"
#    default_model: "sonnet"
#    # Anthropic credentials only work on claude.
#    default_backend: "claude"

cron:
  store_path: "~/.naozhi/cron_jobs.json"
  max_jobs: 50
  # Per-run hard ceiling, independent of the schedule: a run that overlaps the
  # next tick just makes that tick skip. Only stops a wedged CLI from holding
  # a slot forever.
  execution_timeout: "8h"
  # IANA timezone for cron expressions; empty / "Local" = system local ($TZ).
  timezone: "Asia/Shanghai"
  # Fallback IM target for jobs that turn on completion notifications without
  # a per-job target. Both fields required; leave empty to disable.
  notify_default:
    platform: "feishu"
    chat_id: "${NAOZHI_CRON_NOTIFY_CHAT_ID}"
  # 同 schedule 的 job 在 [0, min(jitter_max, period/4)] 内随机延迟起跑。
  # "0" 关闭；上限 10m；dashboard 的 "run now" 不抖动。
  jitter_max: "2m"
  # 连续失败（failed / timed_out）这么多次自动暂停；跳过、取消、后端瞬时故障
  # 不计数（瞬时故障达到次数且持续满 6 小时同样暂停）。负数关闭。
  # 恢复用 /cron resume <id> 或控制台。
  auto_pause_after_failures: 5

# System Session daemons (docs/rfc/system-session.md)。enabled 是总开关，
# 每个 daemon 还有自己的 enabled。
sysession:
  enabled: true
  tick_timeout: 30s
  runner:
    # 推荐 haiku（Anthropic API 与 Bedrock 都能解析）。留空则不传 --model，
    # CLI 用内置默认，通常是贵得多的主力模型。凭证无权调用 haiku 时改成留空
    # 或其它可用模型；实际所用模型见 cost ledger 里 sys:<daemon> 的 model。
    model: haiku
    # 留空默认 <dataDir>/sys-sessions/。
    work_dir: ""
    jsonl_max_age: 168h  # 启动 sweep 保留窗口; "0" 关闭 sweep。
  daemons:
    # 名字必须与 internal/sysession/registry.go 注册的完全一致，否则静默不跑。
    auto-titler:
      enabled: true
      tick: 30s
      min_first_turns: 1   # 累计这么多轮即首次命名
      min_user_turns: 3    # 首次命名后再新增这么多轮才重命名
      min_rename_interval: 5m
      batch_per_tick: 1
      include_group_chat: false
    # attachment-gc: 回收超 TTL 且无引用的附件 (docs/rfc/attachment-gc-daemon.md)。
    # 先 enabled: true + dry_run: true 跑几个周期，在 dashboard「系统」视图看
    # 可回收分桶（重点 meta_no_refs），确认后再改 dry_run: false。
    attachment-gc:
      enabled: false
      tick: 6h            # <1h 会被钉到 1h 下限
      run_on_start: true
      upload_ttl: 168h    # "0"/留空 = 用默认, 非禁用
      ref_ttl: 720h
      per_root_cap: 500   # 每个 workspace 根单 Tick 删除上限
      dry_run: true       # 只记不删

platforms:
  feishu:
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    verification_token: "${FEISHU_VERIFICATION_TOKEN}"
    encrypt_key: "${FEISHU_ENCRYPT_KEY}"
    max_reply_length: 4000

# IM sender access. Anyone who can message the bot can run commands on this
# host, so restrict every platform you enable. Absent = every sender allowed
# (startup and `naozhi config check` warn per open platform). A refused sender
# is logged as "im access denied" with the user ID to copy here; in a direct
# chat they are also told their ID. IDs: Feishu open_id (ou_...), Slack user
# ID (U...), Discord user ID, Weixin from. admin_users alone may run /cron, /cd
# and /project; leave it empty and every allowed user is an admin.
# Reloads without a restart: `naozhi config reload` (or `systemctl reload
# naozhi`); see docs/rfc/config-hot-reload.md. `naozhi setup weixin` writes
# the weixin entry for the WeChat user who scanned the login QR code.
# im_access:
#   default_deny: false     # true refuses every platform without an entry
#   deny_reply: ""          # replaces the direct-chat refusal text
#   platforms:
#     feishu:
#       allowed_users: ["ou_xxxxxxxx"]
#       admin_users: ["ou_yyyyyyyy"]

# Per-sender IM message rate limit (token bucket per platform + user ID).
# Slash commands count; /stop does not. A limited message is dropped and the
# sender told at most once a minute. Absent or 0 = unlimited. Reloads without
# a restart.
# im_rate_limit:
#   msgs_per_min: 10        # sustained rate per sender
#   burst: 3                # back-to-back allowance; 0 = msgs_per_min

# Outbound webhooks (docs/rfc/outbound-webhooks.md): POST run lifecycle events
# of cron jobs and system-session daemons. Payload is run metadata only (ids,
# state, duration, error_class), never prompt / result / error text. Signed
# with HMAC-SHA256 when `secret` is set (X-Naozhi-Signature: sha256=…);
# X-Naozhi-Delivery is an idempotency key. Absent = off.
# integrations:
#   webhooks:
#     - url: https://ci.example.com/hooks/naozhi
#       secret: "${NAOZHI_WEBHOOK_SECRET}"
#       events: [run.ended]          # run.started | run.ended; empty = both
#       subsystems: [cron]           # cron | sysession; empty = both
#       timeout: 10s

# Daily USD budgets from the cost ledger; each cap is independent, absent or
# 0 = off. A spent IM chat gets no new turns (commands still work); a spent
# cron job's runs end skipped/budget_exceeded and never count toward
# auto-pause. Admins are limited too; chats bound to a project share its
# planner's budget. Dashboard turns are never refused but count toward
# daily_usd. A soft cap: a turn let in under it may overshoot. Spend metered in
# credits or tokens (kiro) is not counted. Needs the cost ledger on. Caps,
# warn_ratio and action reload without a restart; adding the first cap or
# moving the timezone needs one.
# cost:
#   budget:
#     per_chat_daily_usd: 20      # each IM chat, across its agents
#     per_cron_job_daily_usd: 5   # each cron job
#     daily_usd: 100              # the whole machine
#     warn_ratio: 0.8             # warn once a day per scope at this share
#     action: block               # block | warn (warn never refuses)
#     timezone: "Asia/Shanghai"   # the day starts at midnight here; default cron.timezone

log:
  level: "info"
  # Size cap for the files launchd / systemd redirect stdout/stderr into;
  # checked hourly, an oversized file is truncated in place to its newest
  # lines. "0" disables.
  stdio_max_size: "64MB"

transcribe:
  enabled: true
  region: "ap-northeast-1"
  language: "zh-CN,en-US"

projects:
  root: "/path/to/your/workspace"
  planner_defaults:
    model: "sonnet"
  # Every non-hidden subdirectory of root is a project. exclude drops more by
  # basename glob (filepath.Match, case-sensitive, no "/").
  # exclude: ["tmp-*", "archive"]
  # Two SINGLE-OPERATOR opt-ins, both default false. Leave them off wherever
  # the dashboard token is shared: both widen what an authenticated dashboard
  # user can read.
  #   include_root — register projects.root itself as a project (spans the
  #                  whole tree, sibling projects included).
  #   public_tmp   — the __public_tmp__ pseudo-project: read non-credential
  #                  files anywhere under /tmp.
  # include_root: false
  # public_tmp: false

# Auto-update: polls GitHub Releases and reuses the verified `naozhi upgrade`
# flow (download → SHA-256 → atomic swap). Enabled by default in "download"
# mode.
#update:
#  enabled: true          # false disables the checker
#  mode: "download"       # notify | download | auto
#                         #   notify   — log + IM notice only
#                         #   download — replace binary, apply on next restart
#                         #   auto     — replace binary AND restart now
#  interval: "6h"         # check cadence (>=1h floor)
#  check_on_start: false  # run one check ~30s after startup
#  dashboard_install: true  # false keeps the dashboard's version chip
#                           # read-only (the apply endpoint 403s)
#  notify:                # optional IM target for update notices
#    platform: "feishu"
#    chat_id: "oc_xxxxx"

# Reverse-connect nodes: remote machines dial in to this primary (NAT traversal).
# Token must match upstream.token on the remote.
#reverse_nodes:
#  pc:
#    token: "${PC_REVERSE_TOKEN}"
#    display_name: "Remote PC"

# Upstream: this node dials a primary naozhi instance (use behind NAT).
#upstream:
#  url: "wss://primary.example.com/ws-node"
#  node_id: "macbook"
#  token: "${UPSTREAM_TOKEN}"
#  display_name: "MacBook Pro"
