<!-- THEME-1 (#453) inline early-paint applier. Reads localStorage('nz_theme'),
     writes :root[data-theme] BEFORE the stylesheet evaluates so we avoid
     a flash of the wrong theme. Stays inline to skip the network round-trip
     dashboard.js incurs. Values: 'light' / 'dark' / 'auto' (default). -->
<script>
(function(){
  try {
    var t = localStorage.getItem('nz_theme');
    if (t !== 'light' && t !== 'dark' && t !== 'auto') t = 'auto';
    document.documentElement.setAttribute('data-theme', t);
  } catch (_) {
    document.documentElement.setAttribute('data-theme', 'auto');
  }
})();
</script>

     before DOMContentLoaded. The inline theme-setter above is self-contained
     and still runs at parse time. (#1769) -->

     global before any module runs). The modules' order is expressed by their
     import graph (nz_util ← dashboard ← views); tags stay listed for
     preload clarity. No async: each file's top-level bootstrap runs in the
     shared deferred queue. -->
