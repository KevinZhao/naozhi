name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  issues: write   # needed by the vuln job to open/comment on security issues

# Cancel in-progress runs on the same ref to save CI budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # go test -race implicitly builds and vets all packages before running.
        # Separate Build and Vet steps are redundant and have been removed.
        run: go test -race -timeout 300s ./...

  # gofmt (make lint-gofmt). fail mode from the start: the backlog this job was
  # added alongside is at 0, and formatting has an unambiguous fix (gofmt -w)
  # with no judgement call, so there is nothing to warn-mode down. Go version
  # comes from go.mod via go-version-file, matching local runs.
  lint-gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run gofmt (fail mode)
        run: make lint-gofmt

  # server-package contracts (lint-server-handlers).
  # fail mode since 2026-07-31: 原计划"Phase 5 完工后切 fail"，但 ADR-001
  # 判定 4b 暂缓后该触发条件不再会到来，warn 模式事实上被永久化。存量已
  # 清零（exemptions.yaml baseline 重采 + 补录），漂移即 exit 1 卡 PR
  # — see docs/design/server-split-phase4-design.md §九.2 / §十五 ADR-001.
  lint-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run lint-server-handlers (fail mode)
        run: make lint-server-fail

  # design doc fact-table drift (lint-fact-table).
  # fail mode since 2026-07-31（同 lint-server：ADR-001 后"Phase 5 完工"
  # 不再是可等待的触发条件）。design + baseline 两文档 token 对账已清零，
  # 漂移即 exit 1 卡 PR。See docs/rfc/lint-fact-table.md.
  lint-fact-table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run lint-fact-table (fail mode)
        run: make lint-fact-table-fail

  # Router field `// 读写:` annotation drift (check-router-fields).
  # router-split P0 safety net (RFC router-god-object-split): every later
  # facet-extraction PR (P1-P5) relies on this to catch annotations that
  # silently rot when a getter moves between router_*.go files.
  # fail mode (P0 safety net armed): any annotation drift exits 1 and blocks
  # the PR, so drift can never silently rot before the P1-P5 facet splits.
  lint-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run check-router-fields (fail mode)
        run: make lint-router-fail

  # staticcheck (make lint-staticcheck). Ran in warn mode (continue-on-error)
  # while a backlog was worked down; both preconditions the old note listed are
  # now met — the SA1019 ImageData deprecation is gone and the ST1018
  # test-payload noise is escaped — so the backlog is at 0 and this is fail
  # mode. Sites where the flagged pattern IS the behaviour under test (nil-ctx
  # guards, empty-critical-section lock probes) carry `//lint:ignore <CHECK>
  # <reason>`; note staticcheck does NOT honour `//nolint`.
  lint-staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run staticcheck (fail mode)
        run: make lint-staticcheck

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Vulnerability findings do not block feature PRs — operators review
    # asynchronously. A GitHub Issue is opened automatically on failure so
    # findings are not silently lost.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        id: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Open issue on vulnerability findings
        if: failure() && github.ref == 'refs/heads/master'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `[vuln] govulncheck findings on ${context.sha.slice(0,7)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
            });
            const existing = issues.find(i => i.title.startsWith('[vuln]'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `New findings on ${context.sha.slice(0,7)} — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `govulncheck found vulnerabilities on master.\n\n**Commit:** ${context.sha}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReview the run log and update affected dependencies.`,
                labels: ['security', 'automated'],
              });
            }

  # darwin hard gate: catches proc_darwin.go / sdnotify_darwin / symlink
  # path divergences that pass Linux silently (e.g. /var → /private/var).
  # Promoted from soft gate (continue-on-error) after tool_result symlink
  # fix confirmed zero flakes on 2026-05-15.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (darwin hard gate)
        run: go build ./...

      - name: Test
        run: go test -race -timeout 300s -short ./...

  # RNEW-TEST-432: Windows build-only job. Not a supported runtime — the
  # gate exists to surface regressions in packages that must compile on
  # all platforms. Shim/discovery syscall isolation was completed 2026-05-15
  # (_unix.go / _windows.go build-tag split), so this is now a hard gate.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...
