name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # flaky_probe forces a synthetic failure so the flaky-report job can be
  # exercised end-to-end without a real master red (#2537).
  workflow_dispatch:
    inputs:
      flaky_probe:
        description: force a synthetic failure to exercise flaky-report
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # needed by the vuln job to open/comment on security issues

# Cancel in-progress runs on the same ref to save CI budget. The event is part
# of the key: a flaky_probe dispatch shares master's ref, and without it that
# dispatch cancels the push run for the commit it is probing — master ends up
# with no completed CI for a commit that was in fact tested.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The -race suite in two parallel shards (#2828): most of the job was
  # compiling every test binary under -race, so halving the package set per
  # runner halves the wall clock. scripts/ci-test-shard.sh owns the split.
  test-shard:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # go test -race implicitly builds and vets the packages it runs.
        # Tests quarantined in .github/quarantine.txt (#2537) are skipped here
        # and run in the non-blocking test-quarantined job instead.
        run: scripts/ci-test-shard.sh ${{ matrix.shard }}

  # The branch-protection required check. It passes only when every shard
  # passed, so protection keeps naming one stable job however the shards move.
  test:
    needs: [test-shard, ratchet-raises, lint-js]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All test shards passed
        run: test "${{ needs.test-shard.result }}" = success
      # Skipped on pushes to master, where there is no base to compare.
      - name: No unapproved ratchet raise
        run: test "${{ needs.ratchet-raises.result }}" = success -o "${{ needs.ratchet-raises.result }}" = skipped
      # S19-0 (#3025): lint-js is already a required context in its own
      # right (D3), but test also needing it means the one check branch
      # protection has always named cannot go green while the JS gate is red.
      - name: lint-js passed
        run: test "${{ needs.lint-js.result }}" = success

  # A pull request that loosens a ratchet — a baseline constant, a JS metric,
  # a dependency edge, a lint exemption — needs a ledger line citing an issue
  # the owner labelled ratchet-raise-approved (#2900). Gated through the
  # required `test` check above.
  ratchet-raises:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check raises against the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/ratchet-raises -base "${{ github.event.pull_request.base.sha }}"

  # gofmt (make lint-gofmt). fail mode from the start: the backlog this job was
  # added alongside is at 0, and formatting has an unambiguous fix (gofmt -w)
  # with no judgement call, so there is nothing to warn-mode down. Go version
  # comes from go.mod via go-version-file, matching local runs.
  lint-gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run gofmt (fail mode)
        run: make lint-gofmt

  # server-package contracts (lint-server-handlers).
  # fail mode since 2026-07-31: 原计划"Phase 5 完工后切 fail"，但 ADR-001
  # 判定 4b 暂缓后该触发条件不再会到来，warn 模式事实上被永久化。存量已
  # 清零（exemptions.yaml baseline 重采 + 补录），漂移即 exit 1 卡 PR
  # — see docs/design/server-split-phase4-design.md §九.2 / §十五 ADR-001.
  lint-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run lint-server-handlers (fail mode)
        run: make lint-server-fail

  # staticcheck (make lint-staticcheck). Ran in warn mode (continue-on-error)
  # while a backlog was worked down; both preconditions the old note listed are
  # now met — the SA1019 ImageData deprecation is gone and the ST1018
  # test-payload noise is escaped — so the backlog is at 0 and this is fail
  # mode. Sites where the flagged pattern IS the behaviour under test (nil-ctx
  # guards, empty-critical-section lock probes) carry `//lint:ignore <CHECK>
  # <reason>`; note staticcheck does NOT honour `//nolint`.
  lint-staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run staticcheck (fail mode)
        run: make lint-staticcheck

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Vulnerability findings do not block feature PRs — operators review
    # asynchronously. A GitHub Issue is opened automatically on failure so
    # findings are not silently lost.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        id: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Open issue on vulnerability findings
        if: failure() && github.ref == 'refs/heads/master'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `[vuln] govulncheck findings on ${context.sha.slice(0,7)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
            });
            const existing = issues.find(i => i.title.startsWith('[vuln]'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `New findings on ${context.sha.slice(0,7)} — [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `govulncheck found vulnerabilities on master.\n\n**Commit:** ${context.sha}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReview the run log and update affected dependencies.`,
                labels: ['security', 'automated'],
              });
            }

  # darwin hard gate: catches proc_darwin.go / sdnotify_darwin / symlink
  # path divergences that pass Linux silently (e.g. /var → /private/var).
  # Scope (#2542): full build+vet, but tests only for the packages carrying
  # platform-divergent code — the ones with //go:build darwin files
  # (internal/discovery, internal/eventlog/persist, internal/selfupdate,
  # internal/shim) plus internal/osutil (direct syscall use). Everything else
  # is platform-neutral Go the Linux job already ran under -race; re-running
  # it here doubled CI machine time (276s) without ever catching a
  # darwin-only red. -short keeps the Short-gated whale tests out.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (darwin hard gate)
        run: go build ./...

      - name: Vet (darwin hard gate)
        run: go vet ./...

      - name: Test platform packages
        run: |
          pattern=$(grep -v '^#' .github/quarantine.txt 2>/dev/null | grep -v '^$' | paste -sd'|' -)
          skip=""
          if [ -n "$pattern" ]; then
            skip="-skip $pattern"
          fi
          go test -race -timeout 300s -short $skip \
            ./internal/osutil/... \
            ./internal/shim/... \
            ./internal/discovery/... \
            ./internal/eventlog/persist/... \
            ./internal/selfupdate/...

  # Playwright mock-server suite (test/e2e). Offline and deterministic: the
  # mock server stubs every API endpoint, and the live multibackend.* specs
  # self-skip without NAOZHI_LIVE_E2E=1. This is the layer that catches real
  # dashboard behaviour regressions in a browser. The iPhone-13 project runs
  # in e2e-mobile-safari below.
  # No workflow-level paths filter: a required check must report a status on
  # every PR, and a paths-filtered job stays "expected" forever on PRs that
  # don't touch the dashboard, blocking the merge.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # rendered_dashboard.test.js boots the page the Go server renders;
      # it fails rather than skips under CI when Go is missing.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Render the dashboard page and CSP
        run: go run ./tools/render-dashboard -out "$RUNNER_TEMP/rendered-dashboard"

      - name: Install Playwright + chromium
        working-directory: test/e2e
        # npm install (not ci): repo policy gitignores package-lock.json
        # (.gitignore:18), and the suite has a single pinned dep.
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run mock-server suite (desktop-chrome)
        working-directory: test/e2e
        env:
          NAOZHI_RENDERED_DASHBOARD_DIR: ${{ runner.temp }}/rendered-dashboard
        run: npx playwright test --project=desktop-chrome

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-test-results
          path: test/e2e/test-results/
          retention-days: 7

  # The iPhone-13 project (webkit). Phone-only paths (visual-viewport drawers,
  # voice gestures, mobile nav) otherwise ship without a CI run. Deliberately
  # not a required check (#3109): a red here does not block a merge, but
  # flaky-report still waits for it and files its master failures.
  e2e-mobile-safari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # rendered_dashboard.test.js boots the page the Go server renders;
      # it fails rather than skips under CI when Go is missing.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Render the dashboard page and CSP
        run: go run ./tools/render-dashboard -out "$RUNNER_TEMP/rendered-dashboard"

      - name: Install Playwright + webkit
        working-directory: test/e2e
        # npm install (not ci): repo policy gitignores package-lock.json.
        run: |
          npm install
          npx playwright install --with-deps webkit

      - name: Run mock-server suite (mobile-safari)
        working-directory: test/e2e
        env:
          NAOZHI_RENDERED_DASHBOARD_DIR: ${{ runner.temp }}/rendered-dashboard
        run: npx playwright test --project=mobile-safari

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mobile-safari-test-results
          path: test/e2e/test-results/
          retention-days: 7

  # JS no-undef gate + cross-file dependency freeze + growth ratchet for the
  # dashboard's classic <script defer> files. eslint.config.mjs holds a
  # per-file globals whitelist (the explicit dependency graph);
  # scripts/js-deps-freeze.mjs enforces that the implicit cross-file reference
  # matrix only shrinks (baseline: scripts/js-deps-baseline.json);
  # scripts/js-ratchet.mjs enforces that per-file line counts, function
  # lengths (every function form, from the AST) and top-level mutable state
  # only shrink
  # (baseline: scripts/js-ratchet.baseline.json).
  lint-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install eslint
        working-directory: test/e2e
        run: npm install

      - name: Run eslint (no-undef gate)
        run: test/e2e/node_modules/.bin/eslint 'internal/server/static/*.js'

      - name: Check cross-file dependency freeze
        run: node scripts/js-deps-freeze.mjs --check

      # The freeze may only shrink, so its tokenizer under-counting (reading
      # code as string text) is what would let new coupling through unseen.
      - name: Test the dependency-freeze tokenizer
        run: node --test scripts/js-deps-freeze.test.mjs

      # nz/shell-bindings and nz/no-exported-let gate how modules share state;
      # a rule that stops matching would pass every file silently.
      - name: Test the dashboard lint rules
        run: node --test scripts/eslint-plugin-nz.test.mjs

      # What the ratchet counts as a function; a counter that stops seeing a
      # form (methods, arrows) would let that form grow unmeasured.
      - name: Test the growth ratchet
        run: node --test scripts/js-ratchet.test.mjs

      # Every dashboard script linted as a module with only the shared browser
      # globals: the condition under which no-undef rules out implicit
      # cross-file references.
      - name: Check the eslint scope
        run: node --test scripts/eslint-config.test.mjs

      - name: Check growth ratchet
        run: node scripts/js-ratchet.mjs --check

      - name: Check WS contract (wsproto schema vs dashboard dispatch)
        run: node test/e2e/check-ws-contract.mjs

      # Frames reach handlers only through the wsm.on table (S18, #3024); a
      # rule that stops matching would let a hand-rolled switch back in.
      - name: Test the WS receiver rules
        run: node --test scripts/check-ws-receivers.test.mjs

      - name: Check WS receivers (no hand-rolled frame-type dispatch)
        run: node scripts/check-ws-receivers.mjs

      # ws_manager.js and session_stream.js are leaves node can import (R7):
      # dispatch order, the auth_ok / auth_fail lifecycle, the outage clock and
      # the subscription bookkeeping run here without a browser.
      - name: Test the WS manager
        run: node --test scripts/ws-manager.test.mjs

      - name: Test the session stream
        run: node --test scripts/session-stream.test.mjs

      # cron_state.js is a leaf too: the merge of a GET /api/cron response
      # with the optimistic run_started / run_ended patches runs against a
      # held fetch and a test-driven clock.
      - name: Test the cron list merge
        run: node --test scripts/cron-state.test.mjs

      # shell.js (S20f, #3026) is the upcall table; registerShell refusing a
      # missing or undeclared slot is what makes a forgotten registration
      # fail at boot instead of at the first click.
      - name: Test the shell table
        run: node --test scripts/shell.test.mjs

      - name: Test the nested WS field check
        run: node --test scripts/ws-contract-nested.test.mjs

      - name: Test the enum-literal checks (death_reason, EventEntry kinds)
        run: node --test scripts/check-enum-literals.test.mjs

      # The e2e mock stands in for the backend: a field it returns that the Go
      # response type does not declare is a test passing against a server that
      # does not exist.
      - name: Check the e2e mock's REST shapes
        run: node --test scripts/check-mock-rest.test.mjs

      - name: Check death_reason and the kinds are read from the generated contract
        run: node scripts/check-enum-literals.mjs

      # The flaky-report regexes fail open — a pattern that stops matching files
      # nothing and the job still goes green, which is indistinguishable from a
      # quiet week. This replays real log lines through them.
      - name: Check flaky-report log parsing
        run: node scripts/check-flaky-report-parse.mjs

  # RNEW-TEST-432: Windows build-only job. Not a supported runtime — the
  # gate exists to surface regressions in packages that must compile on
  # all platforms. Shim/discovery syscall isolation was completed 2026-05-15
  # (_unix.go / _windows.go build-tag split), so this is now a hard gate.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  # Non-blocking runner for quarantined tests (#2537): they stay visible (a
  # fix can be verified here) without holding the merge queue hostage.
  test-quarantined:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run quarantined tests
        run: |
          run=$(grep -v '^#' .github/quarantine.txt 2>/dev/null | grep -v '^$' | paste -sd'|' -)
          if [ -z "$run" ]; then
            echo "quarantine list empty — nothing to run"
            exit 0
          fi
          go test -race -timeout 300s -run "$run" ./...

  # Synthetic failure for exercising flaky-report end-to-end (#2537); only
  # runs on a manual dispatch with flaky_probe=true, skipped otherwise. Emits
  # one line of each shape the reporter parses — `go test`'s and Playwright's —
  # so a single dispatch proves both extractors, not just the Go one.
  probe-fail:
    if: github.event_name == 'workflow_dispatch' && inputs.flaky_probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Synthetic failure
        run: |
          echo "--- FAIL: TestFlakyProbeSynthetic (0.00s)"
          echo "  ✘  1 [desktop-chrome] › probe_synthetic.test.js:1:1 › flaky probe synthetic spec (0.1s)"
          exit 1

  # master red → auto-file a [flaky] issue per failing test (#2537): the last
  # 40 master runs had 4 reds, all flaky, none registered. Reads the failed
  # jobs' logs and dedupes by issue title. Every job that runs tests must be
  # in needs, directly or through an aggregate; check-flaky-report-parse.mjs
  # enforces it.
  flaky-report:
    needs: [test, test-macos, e2e, e2e-mobile-safari, probe-fail]
    if: always() && contains(join(needs.*.result, ','), 'failure') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: jobsResp } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const failures = new Map(); // test name -> job name
            for (const job of jobsResp.jobs) {
              if (job.conclusion !== 'failure') continue;
              let log = '';
              try {
                const resp = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                log = String(resp.data);
              } catch (e) {
                core.warning(`fetch logs for ${job.name}: ${e}`);
                continue;
              }
              // Runner logs carry ANSI colour, which Playwright emits around
              // the ✘ marker.
              const clean = log.replace(/\u001b\[[0-9;]*m/g, '');
              for (const m of clean.matchAll(/--- FAIL: (Test[\w/]+)/g)) {
                if (!failures.has(m[1])) failures.set(m[1], job.name);
              }
              // The e2e job produces no `--- FAIL:` lines: Playwright's list
              // reporter marks each failed spec with ✘. The line:column is
              // dropped from the name so editing anything above a test does
              // not file a second issue for the same test.
              for (const m of clean.matchAll(/✘\s+\d+\s+(?:\[[^\]\n]+\]\s+›\s+)?(\S+?):\d+:\d+\s+›\s+([^\n]+)/g)) {
                // The trailing quote is the runner echoing the step's own script:
                // that line matches too, and without dropping the quote it
                // normalises to a second name for the same test.
                const name = m[1] + ' › ' + m[2].replace(/\s*\(\d+(?:\.\d+)?\s*m?s\)"?\s*$/, '').trim();
                if (!failures.has(name)) failures.set(name, job.name);
              }
            }
            if (failures.size === 0) {
              core.info('no test-failure lines found in failed job logs');
              return;
            }
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'flaky,automated',
              per_page: 100,
            });
            for (const [test, jobName] of failures) {
              const title = `[flaky] ${test}`;
              const body = `master red on ${context.sha.slice(0, 8)} — job \`${jobName}\`, [run](${runURL}).`;
              const existing = open.find(i => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: body + '\n\nAuto-filed by the flaky-report CI job (#2537). Deflake or quarantine via .github/quarantine.txt.',
                  labels: ['flaky', 'automated'],
                });
              }
            }

